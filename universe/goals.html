<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Goals & Ambitions | Universe</title>
    <link rel="icon" type="image/png" href="../assets/images/favicon.png">
    <link rel="stylesheet" href="../assets/css/global.css">

    
    
    <style>
        header nav {
            display: none !important;
        }

        header {
            justify-content: flex-start;
        }
    </style>
    <!-- Theme Data Script (Anti-Flicker) -->
    <script>
        (function () {
            const savedTheme = localStorage.getItem("theme");
            const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = savedTheme || (systemPrefersDark ? "dark" : "light");
            document.documentElement.setAttribute("data-theme", theme);
        })();
    </script>
    <script defer src="../assets/js/component-loader.js"></script>
</head>

<body>
    <div id="nav-placeholder"></div>
    <div class="nav-spacer"></div>

    <main style="text-align: center; padding: 4rem 2rem;">
        <h1 style="margin-bottom: 2rem;">Life Goals & Ambitions</h1>
        <p style="margin-bottom: 4rem;">What I'm striving for.</p>
    </main>

    <script src="../assets/js/app.js"></script>
    
    <script src="../assets/js/lucide.min.js"></script>
    

    
    <!-- Hover Footer -->
    
    <div id="footer-placeholder"></div>
</body>

</html>
